[tox]
min_version = 4.0
envlist = dyopilot, dronekit
skip_missing_interpreters = false

# Which Python for which task. Run one environment with `tox -e <name>`.

[testenv:dyopilot]
description = unit tests on Python 3.12 (dyopilot driver, web console, CLI)
base_python = python3.12
extras = dyopilot, test
commands = pytest {posargs}

[testenv:dronekit]
description = unit tests on Python 3.7 (DroneKit driver plus everything else)
base_python = python3.7
# Python 3.7 cannot run the pip and setuptools that virtualenv seeds by default.
set_env =
    VIRTUALENV_PIP=23.0.1
    VIRTUALENV_SETUPTOOLS=68.0.0
extras = dronekit, test
commands = pytest {posargs}

[testenv:sitl]
description = live-simulator tests on Python 3.12 (needs the ArduCopter SITL binary)
base_python = python3.12
extras = dyopilot, test
commands = pytest -m sitl {posargs}

[testenv:sitl-dronekit]
description = live-simulator tests on Python 3.7
base_python = python3.7
# Python 3.7 cannot run the pip and setuptools that virtualenv seeds by default.
set_env =
    VIRTUALENV_PIP=23.0.1
    VIRTUALENV_SETUPTOOLS=68.0.0
extras = dronekit, test
commands = pytest -m sitl {posargs}

[testenv:docs]
description = build the documentation (warnings are errors)
base_python = python3.12
extras = docs
commands = sphinx-build -W --keep-going -b html docs docs/_build/html
