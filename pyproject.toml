[build-system]
# setuptools 68 is the last release that supports Python 3.7, which the
# DroneKit environment needs.
requires = ["setuptools>=64,<69"]
build-backend = "setuptools.build_meta"

[project]
name = "dyodrone"
version = "0.1.0"
description = "Console and web front ends for commanding a drone via DroneKit or dyopilot (pymavlink)."
requires-python = ">=3.7"
authors = [{ name = "Diogo Silveira" }]
dependencies = []

[project.optional-dependencies]
# Python 3.7 only: DroneKit cannot be imported on 3.10+ (collections.MutableMapping).
dronekit = [
    "dronekit==2.9.2",
    "dronekit-sitl==3.3.0",
    "pymavlink==2.4.8",
    "pyserial==3.5",
    "future==1.0.0",
    "monotonic==1.6",
    "psutil==7.1.3",
    "six==1.17.0",
]
# Python 3.12+. dronekit-sitl declares "dronekit" as a dependency but never
# imports it at runtime, so pip installs it here as unused dead weight.
dyopilot = [
    "dronekit-sitl==3.3.0",
    "pymavlink==2.4.49",
    "pyserial==3.5",
]
docs = [
    "sphinx==9.1.0",
    "furo==2025.12.19",
    "pymavlink==2.4.49",
]
test = [
    "pytest>=7.4,<9",
]

[project.scripts]
dyodrone-cli = "dyodrone.cli:main"
dyodrone-gui = "dyodrone.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dyodrone.gui" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not sitl and not docs'"
filterwarnings = [
    # DroneKit 2.9.2 itself triggers this on Python 3.7; not ours to fix.
    # Sphinx 9.x napoleon uses its own deprecated option mapping.
    "ignore:The mapping interface for autodoc options",
    # pymavlink 2.4.8 (the Python 3.7 pin) uses array.fromstring.
    "ignore:fromstring\\(\\) is deprecated:DeprecationWarning",
    "ignore:Using or importing the ABCs from 'collections':DeprecationWarning",
]
markers = [
    "sitl: needs a live ArduCopter SITL simulator (opt in with -m sitl)",
    "docs: builds the Sphinx documentation (opt in with -m docs)",
    "dronekit: needs DroneKit, i.e. the Python 3.7 environment",
    "dyopilot: needs pymavlink",
]
